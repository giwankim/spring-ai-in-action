[versions]
java = "24"
kotlin = "2.2.21"
kotlin-logging = "7.0.14"
ktlint = "14.0.1"
spring-ai = "2.0.0-M2"
spring-boot = "4.0.2"
spring-dependency-management = "1.1.7"

[libraries]
# Spring Boot
springBoot-starterActuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
springBoot-starterWebMvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }

# Spring AI
springAi-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
springAi-advisorsVectorStore = { module = "org.springframework.ai:spring-ai-advisors-vector-store" }
springAi-starterModelOpenai = { module = "org.springframework.ai:spring-ai-starter-model-openai" }
springAi-starterVectorStoreQdrant = { module = "org.springframework.ai:spring-ai-starter-vector-store-qdrant" }

# Database
springBoot-starterDataJdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
h2 = { module = "com.h2database:h2" }

# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }

# Logging
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }

# Serialization
jackson-moduleKotlin = { module = "tools.jackson.module:jackson-module-kotlin" }

# Docker Compose
springBoot-dockerCompose = { module = "org.springframework.boot:spring-boot-docker-compose" }
springAi-springBootDockerCompose = { module = "org.springframework.ai:spring-ai-spring-boot-docker-compose" }

# Testing
springBoot-starterActuatorTest = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
springBoot-starterDataJdbcTest = { module = "org.springframework.boot:spring-boot-starter-data-jdbc-test" }
springBoot-starterWebmvcTest = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
kotlin-testJunit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }

# Testcontainers
springBoot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
springAi-springBootTestcontainers = { module = "org.springframework.ai:spring-ai-spring-boot-testcontainers" }
testcontainers-junitJupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-qdrant = { module = "org.testcontainers:testcontainers-qdrant" }

[bundles]
springBoot = ["springBoot-starterActuator", "springBoot-starterWebMvc"]
springAi = ["springAi-advisorsVectorStore", "springAi-starterModelOpenai", "springAi-starterVectorStoreQdrant"]
database = ["springBoot-starterDataJdbc"]
dockerCompose = ["springBoot-dockerCompose", "springAi-springBootDockerCompose"]
testcontainers = ["springBoot-testcontainers", "springAi-springBootTestcontainers", "testcontainers-junitJupiter", "testcontainers-qdrant"]
testing = ["springBoot-starterActuatorTest", "springBoot-starterDataJdbcTest", "springBoot-starterWebmvcTest", "kotlin-testJunit5"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependencyManagement = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
