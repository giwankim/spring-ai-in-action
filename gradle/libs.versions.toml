[versions]
kotlin = "1.9.25"
java = "21"
kotlin-logging = "7.0.14"
ktlint = "14.0.1"
spring-ai = "1.1.2"
spring-boot = "3.5.9"
spring-dependency-management = "1.1.7"

[libraries]
# Spring Boot
spring-boot-starterValidation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starterWeb = { module = "org.springframework.boot:spring-boot-starter-web" }

# Spring AI
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
spring-ai-starterModelOpenai = { module = "org.springframework.ai:spring-ai-starter-model-openai" }

# Kotlin
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }

# Jackson
jackson-moduleKotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# Testing
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-testJunit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
spring-boot-starterTest = { module = "org.springframework.boot:spring-boot-starter-test" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependencyManagement = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
